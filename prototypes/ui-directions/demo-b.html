<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo B · 单一跟随阅读资源流 — One Holy Bible</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="%233a2f1e"/><text x="16" y="21" font-size="13" font-weight="700" text-anchor="middle" fill="%23f7f0dd" font-family="Georgia,serif">OHB</text></svg>'>
<style>
:root {
  --canvas: oklch(94% 0.018 88);
  --surface: oklch(98% 0.012 88);
  --surface-2: oklch(92.5% 0.017 86);
  --ink: oklch(22% 0.018 74);
  --ink-soft: oklch(35% 0.02 72);
  --muted: oklch(50% 0.018 78);
  --faint: oklch(62% 0.019 82);
  --line: oklch(83% 0.02 82);
  --line-strong: oklch(74% 0.025 78);
  --accent: oklch(58% 0.095 75);
  --accent-deep: oklch(44% 0.085 70);
  --accent-soft: oklch(91% 0.055 82);
  --accent-tint: oklch(96% 0.03 85);
  --cool: oklch(48% 0.04 230);
  --cool-soft: oklch(93% 0.02 230);
  --danger: oklch(48% 0.11 28);
  --danger-soft: oklch(93% 0.03 28);
  --font-ui: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
  --font-scripture: "Songti SC", "STSong", "Noto Serif SC", Georgia, serif;
  --scripture-size: 20px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--font-ui); font-size: 14px; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: none; padding: 0; }
input, select { font: inherit; color: inherit; }
:is(button, input, select, [tabindex]):focus-visible { outline: 2px solid var(--accent-deep); outline-offset: 1px; border-radius: 6px; }

/* ---------- 工具栏 ---------- */
.toolbar { align-items: center; background: var(--surface-2); border-bottom: 1px solid var(--line); display: flex; gap: 12px; height: 52px; padding: 0 14px; }
.brand { align-items: center; display: flex; font-weight: 650; gap: 8px; }
.brand__mark { align-items: center; background: var(--ink); border-radius: 6px; color: var(--surface); display: inline-flex; font-size: 10px; font-weight: 760; height: 24px; justify-content: center; width: 32px; }
.nav-group { align-items: center; display: flex; gap: 4px; }
.tool-btn { align-items: center; border: 1px solid transparent; border-radius: 7px; color: var(--ink-soft); display: inline-flex; gap: 6px; height: 30px; padding: 0 10px; transition: background 150ms var(--ease); }
.tool-btn:hover { background: oklch(100% 0 0 / 45%); border-color: var(--line); }
.tool-btn--book { font-weight: 600; color: var(--ink); }
.seg { background: oklch(100% 0 0 / 42%); border: 1px solid var(--line); border-radius: 8px; display: inline-flex; gap: 2px; padding: 2px; }
.seg button { border-radius: 6px; color: var(--muted); height: 26px; padding: 0 12px; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 2px oklch(40% 0.03 70 / 12%); color: var(--ink); font-weight: 600; }
.search { align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; display: flex; flex: 0 1 300px; gap: 6px; height: 32px; margin-left: auto; padding: 0 10px; }
.search:focus-within { border-color: var(--accent); }
.search input { background: none; border: none; flex: 1; min-width: 0; outline: none; }
.autosave { align-items: center; color: var(--muted); display: inline-flex; font-size: 12px; gap: 5px; white-space: nowrap; }
.autosave.pulse { color: var(--accent-deep); }
.autosave .dot { background: var(--accent); border-radius: 50%; height: 6px; transition: transform 300ms var(--ease); width: 6px; }
.autosave.pulse .dot { transform: scale(1.5); }
.pop-wrap { position: relative; }
.popover {
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px;
  box-shadow: 0 16px 40px oklch(35% 0.04 60 / 18%); display: none; min-width: 230px;
  padding: 10px; position: absolute; right: 0; top: 36px; z-index: 40;
}
.popover.open { display: block; }
.popover h4 { color: var(--muted); font-size: 11px; font-weight: 650; letter-spacing: 0.04em; margin: 2px 4px 8px; }
.lib-row { align-items: center; border-radius: 7px; display: flex; gap: 9px; padding: 7px 8px; }
.lib-row:hover { background: var(--surface-2); }
.lib-row input { accent-color: var(--accent-deep); }
.lib-row .n { flex: 1; font-size: 13px; }
.lib-row .c { color: var(--faint); font-size: 11px; }
.menu button { border-radius: 6px; display: flex; gap: 8px; padding: 8px 10px; text-align: left; width: 100%; }
.menu button:hover { background: var(--surface-2); }
.menu .menu-danger { color: var(--danger); }
.menu-sep { border-top: 1px solid var(--line); margin: 4px 2px; }

/* ---------- 布局:中央阅读 + 右侧单一资源流 ---------- */
.workspace { display: grid; grid-template-columns: minmax(0, 1fr) 360px; height: calc(100vh - 52px); }
.reader { display: flex; flex-direction: column; min-width: 0; }
.masthead { align-items: center; display: flex; gap: 12px; justify-content: center; padding: 18px 20px 10px; }
.masthead h1 { font-family: var(--font-scripture); font-size: 26px; font-weight: 700; margin: 0; }
.masthead .en { color: var(--faint); font-family: var(--font-scripture); font-size: 15px; font-style: italic; }
.ch-nav { align-items: center; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); display: inline-flex; gap: 4px; height: 28px; padding: 0 12px; }
.ch-nav:hover { background: var(--surface); color: var(--ink); }
.kbd-hint { color: var(--faint); font-size: 11.5px; text-align: center; padding-bottom: 6px; }
.kbd-hint kbd { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; font-family: inherit; font-size: 10.5px; padding: 0 5px; }
.columns { display: grid; flex: 1; grid-template-columns: 1fr 1fr; min-height: 0; padding: 0 8px 8px; }
.bible-column { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.column-head { color: var(--muted); font-size: 12px; font-weight: 650; letter-spacing: 0.03em; padding: 6px 26px; }
.verse-scroll { border-top: 1px solid var(--line); overflow-y: auto; padding: 14px 10px 40px; }
.bible-column + .bible-column .verse-scroll, .bible-column + .bible-column .column-head { border-left: 1px solid var(--line); }
.verse { border: 1px solid transparent; border-radius: 9px; display: grid; gap: 10px; grid-template-columns: 26px 1fr; padding: 7px 12px; text-align: left; width: 100%; }
.verse:hover { background: oklch(100% 0 0 / 55%); }
.verse .vn { color: var(--faint); font-size: 12px; font-weight: 600; padding-top: 5px; text-align: right; }
.verse .vt { font-family: var(--font-scripture); font-size: var(--scripture-size); line-height: 1.8; }
.verse[aria-current="true"] { background: var(--accent-tint); border-color: oklch(84% 0.05 82); }
.verse[aria-current="true"] .vn { color: var(--accent-deep); }
.verse[aria-current="true"] .vt { font-weight: 600; }
.kjv .verse .vt { font-size: calc(var(--scripture-size) - 2px); line-height: 1.68; }
.verse .has-cards { align-self: center; background: var(--accent-soft); border-radius: 50%; height: 5px; justify-self: end; width: 5px; }

/* ---------- 右侧:单一资源流 ---------- */
.stream { background: var(--canvas); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.stream-head { border-bottom: 1px solid var(--line); padding: 12px 14px 10px; }
.stream-head .t { align-items: baseline; display: flex; gap: 8px; }
.stream-head strong { font-size: 13.5px; }
.stream-head .sub { color: var(--faint); font-size: 11px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 12px; padding: 3px 10px; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.chip:hover:not([aria-pressed="true"]) { border-color: var(--line-strong); color: var(--ink); }
.stream-body { flex: 1; overflow-y: auto; padding: 4px 14px 40px; scroll-behavior: smooth; }
.v-group { padding-top: 10px; }
.v-group-head {
  align-items: baseline; background: var(--canvas); display: flex; gap: 8px;
  padding: 6px 2px; position: sticky; top: 0; z-index: 5;
}
.v-group-head .ref { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.02em; }
.v-group-head .cnt { color: var(--faint); font-size: 11px; }
.v-group-head .goto { color: var(--faint); font-size: 11px; margin-left: auto; }
.v-group-head .goto:hover { color: var(--accent-deep); }
.v-group.current .v-group-head .ref { color: var(--accent-deep); }
.v-group.current .v-group-head { background: var(--accent-tint); border-radius: 7px; }
.v-group.flash .v-group-head { animation: flash 900ms var(--ease); }
@keyframes flash { 0% { background: var(--accent-soft); } 100% { background: var(--accent-tint); } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin: 8px 0 0; padding: 11px 12px; position: relative; }
.card:hover { border-color: var(--line-strong); }
.card .meta { align-items: center; color: var(--faint); display: flex; font-size: 11px; gap: 6px; margin-bottom: 4px; }
.card .meta .type { background: var(--surface-2); border-radius: 4px; color: var(--muted); font-weight: 600; padding: 1px 6px; }
.card .meta .type--media { background: var(--cool-soft); color: var(--cool); }
.card .meta .pin-flag { color: var(--accent-deep); font-weight: 650; }
.card h4 { font-size: 13px; font-weight: 650; margin: 0 0 5px; }
.card .excerpt { color: var(--ink-soft); font-size: 12.5px; line-height: 1.66; margin: 0; }
.card-actions {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 4px 14px oklch(35% 0.04 60 / 12%); display: flex; gap: 2px; opacity: 0;
  padding: 2px; position: absolute; right: 8px; top: 8px; transition: opacity 140ms var(--ease);
}
.card:hover .card-actions, .card:focus-within .card-actions, .showcase .card-actions { opacity: 1; }
.card-actions button { border-radius: 6px; color: var(--muted); display: inline-flex; padding: 5px; }
.card-actions button:hover { background: var(--surface-2); color: var(--ink); }
.card-actions .act-danger:hover { background: var(--danger-soft); color: var(--danger); }
.media-thumb { align-items: center; background: var(--cool-soft); border: 1px solid oklch(86% 0.02 230); border-radius: 7px; color: var(--cool); display: flex; font-size: 11px; font-weight: 600; gap: 6px; justify-content: center; height: 74px; margin-bottom: 7px; }
.empty-quiet { color: var(--faint); font-size: 12px; padding: 8px 2px 0; }

.toasts { display: flex; flex-direction: column; gap: 8px; position: fixed; right: 16px; top: 62px; z-index: 80; }
.toast { align-items: center; animation: toast-in 220ms var(--ease); background: var(--ink); border-radius: 9px; box-shadow: 0 10px 30px oklch(30% 0.04 60 / 25%); color: var(--surface); display: flex; font-size: 13px; gap: 10px; padding: 9px 13px; }
.toast button { color: oklch(88% 0.06 85); font-weight: 650; }
.toast button:hover { text-decoration: underline; }
@keyframes toast-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>

<header class="toolbar">
  <div class="brand"><span class="brand__mark">OHB</span>One Holy Bible</div>
  <div class="nav-group">
    <button class="tool-btn tool-btn--book">创世记 <span style="color:var(--faint)">▾</span></button>
    <button class="tool-btn" aria-label="上一章">‹</button>
    <button class="tool-btn" style="padding:0 4px">第 1 章</button>
    <button class="tool-btn" aria-label="下一章">›</button>
  </div>
  <div class="seg" role="group" aria-label="阅读视图">
    <button id="viewCuv" aria-pressed="false">和合本</button>
    <button id="viewKjv" aria-pressed="false">KJV</button>
    <button id="viewBoth" aria-pressed="true">对照</button>
  </div>
  <div class="search">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="color:var(--faint)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="searchInput" type="search" placeholder="搜索经文,按 Enter 跳转" aria-label="搜索经文">
  </div>
  <div class="pop-wrap">
    <button class="tool-btn" id="libBtn">资源库 <span style="color:var(--faint)">▾</span></button>
    <div class="popover" id="libPop">
      <h4>资源流包含</h4>
      <label class="lib-row"><input type="checkbox" data-src="综合解读" checked><span class="n">综合解读</span><span class="c">5</span></label>
      <label class="lib-row"><input type="checkbox" data-src="研读本圣经" checked><span class="n">研读本圣经</span><span class="c">1</span></label>
      <label class="lib-row"><input type="checkbox" data-src="圣经信息系列" checked><span class="n">圣经信息系列</span><span class="c">3</span></label>
      <label class="lib-row"><input type="checkbox" data-src="用户笔记" checked><span class="n">我的笔记</span><span class="c">1</span></label>
    </div>
  </div>
  <span class="autosave" id="autosave"><span class="dot"></span>已自动保存</span>
  <div class="pop-wrap">
    <button class="tool-btn" id="overflowBtn" title="更多">⋯</button>
    <div class="popover menu" id="overflowMenu" style="padding:5px">
      <button>刷新卡片资源</button>
      <button>阅读设置…</button>
      <div class="menu-sep"></div>
      <button class="menu-danger">重置布局…</button>
    </div>
  </div>
</header>

<div class="toasts" id="toasts"></div>

<div class="workspace">
  <main class="reader">
    <div class="masthead">
      <button class="ch-nav">‹ 上一章</button>
      <h1>创世记 1</h1><span class="en">Genesis</span>
      <button class="ch-nav">下一章 ›</button>
    </div>
    <div class="kbd-hint"><kbd>↑</kbd> <kbd>↓</kbd> 逐节移动 · 点选经文,右侧资源流自动跟随</div>
    <div class="columns" id="columns">
      <div class="bible-column cuv" id="colCuv">
        <div class="column-head">和合本 · 中文</div>
        <div class="verse-scroll" id="scrollCuv"></div>
      </div>
      <div class="bible-column kjv" id="colKjv">
        <div class="column-head">KJV · English</div>
        <div class="verse-scroll" id="scrollKjv"></div>
      </div>
    </div>
  </main>

  <aside class="stream">
    <div class="stream-head">
      <div class="t"><strong id="streamTitle">跟随阅读 · 创世记 1:1</strong><span class="sub" id="streamCount"></span></div>
      <div class="chips" id="typeChips"></div>
    </div>
    <div class="stream-body" id="streamBody"></div>
  </aside>
</div>

<script src="gen1-data.js"></script>
<script>
const D = window.OHB_DATA;
const state = { verse: 3, filter: '全部', pinned: new Set(['note-1']), removed: new Set(), sources: new Set(['综合解读','研读本圣经','圣经信息系列','用户笔记']) };
const refCn = v => `创世记 1:${v}`;
const anchorNum = a => Number(a.split('.')[2]);
const activeCards = () => D.cards.filter(c => !state.removed.has(c.id) && state.sources.has(c.source));

/* ---- 经文 ---- */
function renderColumns() {
  const withCards = new Set(activeCards().map(c => anchorNum(c.anchor)));
  for (const [key, id] of [['cuv','scrollCuv'], ['kjv','scrollKjv']]) {
    const host = document.getElementById(id);
    host.innerHTML = '';
    for (const v of D[key]) {
      const b = document.createElement('button');
      b.className = 'verse';
      b.dataset.v = v.v;
      b.setAttribute('aria-current', String(v.v === state.verse));
      b.innerHTML = `<span class="vn">${v.v}</span><span class="vt">${v.t}</span>${key === 'cuv' && withCards.has(v.v) ? '<span class="has-cards" title="本节有卡片"></span>' : ''}`;
      if (key === 'cuv' && withCards.has(v.v)) b.style.gridTemplateColumns = '26px 1fr 10px';
      b.addEventListener('click', () => selectVerse(v.v));
      host.appendChild(b);
    }
  }
}
function selectVerse(v, opts = {}) {
  state.verse = v;
  document.querySelectorAll('.verse').forEach(el => el.setAttribute('aria-current', String(Number(el.dataset.v) === v)));
  document.getElementById('streamTitle').textContent = `跟随阅读 · ${refCn(v)}`;
  if (!opts.silent) document.querySelectorAll(`.verse[data-v="${v}"]`).forEach(el => el.scrollIntoView({ block: 'center', behavior: 'smooth' }));
  highlightStream(v);
}

/* ---- 资源流 ---- */
function cardEl(c) {
  const el = document.createElement('article');
  el.className = 'card';
  const isPinned = state.pinned.has(c.id);
  el.innerHTML = `
    <div class="meta"><span class="type ${c.type === 'media' ? 'type--media' : ''}">${c.typeLabel}</span><span>${c.source}</span>${isPinned ? '<span class="pin-flag">★ 已钉住</span>' : ''}</div>
    ${c.type === 'media' ? `<div class="media-thumb">▦ 图片 · ${c.title.slice(0, 14)}…</div>` : ''}
    <h4>${c.title}</h4>
    <p class="excerpt">${c.body.slice(0, 96)}${c.body.length > 96 ? '…' : ''}</p>
    <div class="card-actions">
      <button title="${isPinned ? '取消钉住' : '钉住(常驻顶部)'}" data-act="pin">${isPinned ? '★' : '☆'}</button>
      <button title="编辑" data-act="edit">✎</button>
      <button title="复制" data-act="copy">⧉</button>
      <button class="act-danger" title="移除(可撤销)" data-act="remove">✕</button>
    </div>`;
  el.querySelector('[data-act="pin"]').addEventListener('click', () => {
    state.pinned.has(c.id) ? state.pinned.delete(c.id) : state.pinned.add(c.id);
    toast(state.pinned.has(c.id) ? '已钉住,常驻资源流顶部' : '已取消钉住');
    renderStream(); pulseAutosave();
  });
  el.querySelector('[data-act="copy"]').addEventListener('click', () => toast('卡片内容已复制'));
  el.querySelector('[data-act="edit"]').addEventListener('click', () => toast('打开编辑器(demo 略)'));
  el.querySelector('[data-act="remove"]').addEventListener('click', () => {
    state.removed.add(c.id); renderStream(); renderColumns();
    toast(`已移除「${c.title.slice(0, 12)}…」`, { label: '撤销', fn: () => { state.removed.delete(c.id); renderStream(); renderColumns(); } });
  });
  return el;
}
function renderStream() {
  const cards = activeCards().filter(c => state.filter === '全部' || c.typeLabel === state.filter);
  document.getElementById('streamCount').textContent = `${cards.length} 张卡片`;
  const chips = document.getElementById('typeChips');
  chips.innerHTML = '';
  const counts = { 全部: activeCards().length };
  activeCards().forEach(c => counts[c.typeLabel] = (counts[c.typeLabel] || 0) + 1);
  for (const label of Object.keys(counts)) {
    const b = document.createElement('button');
    b.className = 'chip';
    b.setAttribute('aria-pressed', String(state.filter === label));
    b.textContent = label === '全部' ? `全部 ${counts[label]}` : `${label} ${counts[label]}`;
    b.addEventListener('click', () => { state.filter = label; renderStream(); });
    chips.appendChild(b);
  }
  const host = document.getElementById('streamBody');
  host.innerHTML = '';
  const pinned = cards.filter(c => state.pinned.has(c.id));
  if (pinned.length) {
    const g = document.createElement('div');
    g.className = 'v-group';
    g.innerHTML = `<div class="v-group-head"><span class="ref">★ 已钉住</span><span class="cnt">${pinned.length} 张</span></div>`;
    pinned.forEach(c => g.appendChild(cardEl(c)));
    host.appendChild(g);
  }
  const rest = cards.filter(c => !state.pinned.has(c.id));
  const byVerse = new Map();
  rest.forEach(c => {
    const v = anchorNum(c.anchor);
    if (!byVerse.has(v)) byVerse.set(v, []);
    byVerse.get(v).push(c);
  });
  for (const v of [...byVerse.keys()].sort((a, b) => a - b)) {
    const g = document.createElement('div');
    g.className = 'v-group';
    g.dataset.v = v;
    g.innerHTML = `<div class="v-group-head"><span class="ref">${refCn(v)}</span><span class="cnt">${byVerse.get(v).length} 张</span><button class="goto" title="定位到这节经文">定位经文 ↖</button></div>`;
    g.querySelector('.goto').addEventListener('click', () => selectVerse(v));
    byVerse.get(v).forEach(c => g.appendChild(cardEl(c)));
    host.appendChild(g);
  }
  if (!cards.length) host.innerHTML = '<p class="empty-quiet">当前筛选下没有卡片。</p>';
  highlightStream(state.verse, { scroll: false });
}
function highlightStream(v, opts = {}) {
  let target = null;
  document.querySelectorAll('.v-group[data-v]').forEach(g => {
    const is = Number(g.dataset.v) === v;
    g.classList.toggle('current', is);
    if (is) target = g;
  });
  if (target && opts.scroll !== false) {
    target.classList.remove('flash'); void target.offsetWidth; target.classList.add('flash');
    target.scrollIntoView({ block: 'start', behavior: 'smooth' });
  }
}

/* ---- 视图/搜索/反馈/浮层 ---- */
function setView(mode) {
  document.getElementById('colCuv').style.display = mode === 'kjv' ? 'none' : 'flex';
  document.getElementById('colKjv').style.display = mode === 'cuv' ? 'none' : 'flex';
  document.getElementById('columns').style.gridTemplateColumns = mode === 'both' ? '1fr 1fr' : 'minmax(0, 720px)';
  document.getElementById('columns').style.justifyContent = 'center';
  for (const [id, m] of [['viewCuv','cuv'], ['viewKjv','kjv'], ['viewBoth','both']])
    document.getElementById(id).setAttribute('aria-pressed', String(m === mode));
  pulseAutosave();
}
['viewCuv','viewKjv','viewBoth'].forEach(id =>
  document.getElementById(id).addEventListener('click', () => setView(id.replace('view','').toLowerCase())));

let autosaveTimer;
function pulseAutosave() {
  const el = document.getElementById('autosave');
  el.classList.add('pulse');
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(() => el.classList.remove('pulse'), 1200);
}
function toast(msg, action) {
  const host = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span>${msg}</span>`;
  if (action) {
    const b = document.createElement('button');
    b.textContent = action.label;
    b.addEventListener('click', () => { action.fn(); t.remove(); });
    t.appendChild(b);
  }
  host.appendChild(t);
  setTimeout(() => t.remove(), action ? 8000 : 3200);
}

for (const [btnId, popId] of [['libBtn','libPop'], ['overflowBtn','overflowMenu']]) {
  const pop = document.getElementById(popId);
  document.getElementById(btnId).addEventListener('click', e => {
    e.stopPropagation();
    document.querySelectorAll('.popover').forEach(p => p !== pop && p.classList.remove('open'));
    pop.classList.toggle('open');
  });
  pop.addEventListener('click', e => e.stopPropagation());
}
document.addEventListener('click', () => document.querySelectorAll('.popover').forEach(p => p.classList.remove('open')));
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.popover').forEach(p => p.classList.remove('open')); });
document.querySelectorAll('#libPop input').forEach(cb => cb.addEventListener('change', () => {
  cb.checked ? state.sources.add(cb.dataset.src) : state.sources.delete(cb.dataset.src);
  renderStream(); renderColumns(); pulseAutosave();
}));

document.addEventListener('keydown', e => {
  if (e.target.matches('input, select, textarea')) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); selectVerse(Math.min(31, state.verse + 1)); }
  if (e.key === 'ArrowUp') { e.preventDefault(); selectVerse(Math.max(1, state.verse - 1)); }
});

document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const q = e.target.value.trim();
  if (!q) return;
  const hits = D.cuv.filter(v => v.t.includes(q)).map(v => v.v);
  if (!hits.length) { toast(`本章未找到「${q}」`); return; }
  toast(`「${q}」本章 ${hits.length} 处,已跳转第一处`);
  selectVerse(hits[0]);
});

renderColumns();
renderStream();
setView('both');
document.getElementById('streamTitle').textContent = `跟随阅读 · ${refCn(state.verse)}`;
if (location.hash.includes('showcase')) document.querySelector('.stream').classList.add('showcase');
</script>
</body>
</html>
