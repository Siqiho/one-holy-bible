name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run validate:public-data
      # Full `npm test` / app `tsc` / `vite build` need unpublished local
      # workbench v4, CMC JSON, and Genesis/Doré image fixtures. This snapshot
      # is remote-only, so CI runs the public-package suite instead.
      - run: npm run test:ci
      - run: npx tsc -p tsconfig.node.json --noEmit
